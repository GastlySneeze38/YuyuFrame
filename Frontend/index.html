<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YuyuFrame</title>
    <!--
      Tout ce qui suit est EN LIGNE, sans fichier ni police à aller chercher :
      le moteur le peint en lisant l'en-tête, avant même de télécharger le JS.
      Une ressource séparée arriverait après ce qu'elle doit masquer.

      Sans ça, la fenêtre affichait son fond par défaut — du blanc — pendant
      la centaine de millisecondes qui sépare son ouverture du premier rendu
      de React. Le décor ci-dessous reprend le fond et la barre de titre de
      l'application pour que le passage au vrai rendu ne se remarque pas.
      Il disparaît tout seul : React remplace le contenu de #root.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #09090d;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* Même hauteur et même trait que le vrai TitleBar : rien ne saute au
         moment de la bascule. */
      #boot .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        flex: none;
        padding: 0 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      #boot .mark {
        width: 14px;
        height: 14px;
        border-radius: 2px;
        background: #4b3fcf;
      }

      #boot .name {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.5);
      }

      #boot .stage {
        position: relative;
        flex: 1;
        overflow: hidden;
      }

      /* Le halo de la page d'accueil, en dégradé pur : aucune image. */
      #boot .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 50% at 30% 40%, rgba(75, 63, 207, 0.18) 0%, transparent 70%),
          radial-gradient(50% 40% at 75% 65%, rgba(75, 63, 207, 0.1) 0%, transparent 70%);
      }

      /* Respiration discrète : le démarrage a l'air vivant sans rien coûter,
         une animation composée ne touche ni au JS ni à la mise en page. */
      #boot .pulse {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 6px;
        background: #4b3fcf;
        opacity: 0.85;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(0.82);
          opacity: 0.45;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .pulse {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="bar">
          <div class="mark"></div>
          <span class="name">YUYUFRAME</span>
        </div>
        <div class="stage">
          <div class="glow"></div>
          <div class="pulse"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
