name: iOS (test)

# Build d'essai pour iPhone, lancé à la main seulement :
#   gh workflow run ios.yml --repo GastlySneeze38/YuyuFrame
#
# Le .ipa n'est PAS signé : Sideloadly ou SideStore le signent à l'installation
# avec un compte Apple gratuit. Ce workflow n'a donc besoin d'aucun secret.
#
# Il range le .ipa dans un seul brouillon, `ios-dev`, jamais publié et remplacé à
# chaque build. Ce nom ne commence pas par `v` : il ne déclenche pas release.yml,
# et le .ipa ne peut pas partir avec le .exe et l'APK d'une vraie version.
on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Branche, tag ou commit du moteur (YuyuFrame-Mobile)
        required: false
        default: main

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 240
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
      IPA_NAME: YuyuFrame-ios-dev.ipa
      # Tauri exige une équipe Apple pour générer le projet. Celle-ci ne signe
      # rien : la signature est coupée par le fichier xcconfig plus bas.
      APPLE_DEVELOPMENT_TEAM: '0000000000'
    steps:
      # Côte à côte, comme dans le monorepo et le job Android de release.yml.
      - uses: actions/checkout@v4
        with:
          path: Launcher-Client

      - uses: actions/checkout@v4
        with:
          repository: GastlySneeze38/YuyuFrame-Mobile
          ref: ${{ inputs.engine_ref }}
          path: horizon-android

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Le Rust épinglé par le moteur, comme pour Android.
      - name: Install Rust for iOS
        run: bash horizon-android/tools/ci/rustup_install.sh --profile minimal --component rust-src --target aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios
          workspaces: |
            horizon-android
            Launcher-Client/Backend

      - name: Install the iOS project generator
        run: brew install xcodegen

      - name: Install frontend deps
        working-directory: Launcher-Client/Frontend
        run: npm ci

      # La phase « Build Rust Code » du projet Xcode lance
      # `npm run -- tauri ios xcode-script …` depuis gen/apple. npm remonte
      # jusqu'au premier package.json, et Backend/ n'en a pas (le CLI est dans
      # Frontend/) : ENOENT. Même souci qu'Android (BuildTask.kt). On pose ici,
      # pour la CI seulement, un package.json dont le script `tauri` renvoie au
      # CLI du Frontend, comme la commande qu'on tape.
      # Ce package.json fait aussi de Backend/ le dossier d'où Tauri lance
      # `beforeBuildCommand` (`npm --prefix Frontend run build`, écrit pour
      # Launcher-Client/) : un lien Backend/Frontend → ../Frontend le garde juste.
      - name: Point npm at the Tauri CLI
        working-directory: Launcher-Client/Backend
        run: |
          cat > package.json <<'EOF'
          { "private": true, "scripts": { "tauri": "npx --prefix ../Frontend tauri" } }
          EOF
          ln -s ../Frontend Frontend
          test -f Frontend/package.json

      - name: Generate the iOS project
        working-directory: Launcher-Client/Backend
        run: npx --prefix ../Frontend tauri ios init --ci

      # Sans compte Apple, Xcode ne doit rien signer ni chercher de profil.
      # Tauri lance `xcodebuild -allowProvisioningUpdates` avec l'équipe
      # factice en signature automatique, d'où « No Accounts ». Il ne transmet
      # pas XCODE_XCCONFIG_FILE à xcodebuild (environnement filtré), donc on
      # passe par un xcodebuild à nous, placé devant dans le PATH : il retire
      # -allowProvisioningUpdates et ajoute en ligne de commande, qui passe
      # devant tout le reste, les réglages qui coupent la signature. L'export
      # (-exportArchive) passe tel quel : il échoue sans signature, seule la
      # .app compte. Le moteur est compilé ici, par la phase « Build Rust Code ».
      - name: Build the app without signing it
        working-directory: Launcher-Client/Backend
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/xcodebuild" <<'EOF'
          #!/bin/bash
          real=/usr/bin/xcodebuild
          for a in "$@"; do
            if [ "$a" = "-exportArchive" ]; then exec "$real" "$@"; fi
          done
          args=()
          for a in "$@"; do
            [ "$a" = "-allowProvisioningUpdates" ] || args+=("$a")
          done
          echo "[xcodebuild sans signature] ${args[*]}" >&2
          exec "$real" "${args[@]}"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=             CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE=             PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS=
          EOF
          chmod +x "$RUNNER_TEMP/bin/xcodebuild"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          command -v xcodebuild
          npx --prefix ../Frontend tauri ios build --ci --target aarch64 || echo "tauri ios build a échoué : on regarde si l'appli existe quand même."
          # L'export final échoue sans signature ; seule la .app compte. Elle
          # est dans l'archive si Tauri a archivé, sinon dans les produits du build.
          app=$(find gen/apple/build -maxdepth 6 -type d -path '*.xcarchive/Products/Applications/*.app' 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            app=$(find gen/apple/build "$HOME/Library/Developer/Xcode/DerivedData" -type d -name '*.app' -path '*iphoneos*' 2>/dev/null | grep -v '\.app/' | head -1)
          fi
          test -n "$app" || { echo "aucune .app produite : la compilation a échoué, voir plus haut"; exit 1; }
          echo "APP=$(cd "$(dirname "$app")" && pwd)/$(basename "$app")" >> "$GITHUB_ENV"

      - name: Package the .ipa
        run: |
          echo "appli : $APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/$IPA_NAME" Payload)
          ls -lh "$RUNNER_TEMP/$IPA_NAME"

      # Gardé dans le run : si l'envoi au brouillon échoue, rien n'est à recompiler.
      - uses: actions/upload-artifact@v4
        with:
          name: yuyuframe-ios-dev
          path: ${{ runner.temp }}/${{ env.IPA_NAME }}
          retention-days: 7

      - name: Put the .ipa in the ios-dev draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ios-dev > /dev/null 2>&1; then
            gh release create ios-dev --draft --target "$GITHUB_SHA" \
              --title "iOS (build d'essai)" \
              --notes "Brouillon de test, à ne pas publier. Le .ipa est remplacé à chaque build."
          fi
          gh release upload ios-dev "$RUNNER_TEMP/$IPA_NAME" --clobber
