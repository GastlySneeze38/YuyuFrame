[package]
name = "yuyuframe-backend"
# SEULE version du launcher — celle du paquet ET celle annoncée au serveur.
#
# Elle vivait en double : ici pour le code (`env!("CARGO_PKG_VERSION")`, qui
# part à l'authentification, à chaque `/v1/config` et dans les statistiques)
# et dans `tauri.conf.json` pour l'exécutable publié. Seule la seconde était
# incrémentée à chaque sortie : toute la flotte se présentait donc au serveur
# comme « 0.1.0 », ce qui rendait inopérants la version minimale, les versions
# bloquées et le ciblage « versions antérieures à » des bannières.
#
# `tauri.conf.json` n'a plus de champ `version` : Tauri reprend celle-ci.
# C'est donc ICI qu'on incrémente avant de publier.
version = "0.1.7"
edition = "2021"

[lib]
name = "yuyuframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yuyuframe-backend"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = { version = "2", features = ["deflate"] }
# Liens de partage (share_link.rs) : zstd + dictionnaire figé. Déjà compilée
# pour `zip`, la déclarer n'ajoute rien au build.
zstd = { version = "0.13", default-features = false }
toml = "0.8"
rand = "0.8"
base64 = "0.22"
sha1 = "0.10"
# Licence hors ligne (security/license.rs) : vérification seule, jamais de signature
# ici — la clé privée ne quitte pas le serveur.
ed25519-dalek = "2"
sha2 = "0.10"
tungstenite = "0.24"
uuid = { version = "1", features = ["v4"] }
libp2p = { version = "0.53", features = [
    "tokio", "tcp", "dns", "noise", "yamux",
    "identify", "relay", "dcutr", "request-response", "cbor", "macros",
] }
futures = "0.3"
sysinfo = "0.31"
discord-rich-presence = "1"
fastnbt = "2"
md-5 = "0.10"

# `multipart` : envoi d'un PNG de skin à Mojang (voir commands/account/skin.rs
# — un fichier local devient ainsi un skin hébergé par eux, donc partageable).
# gzip/brotli : réponses des API compressées (`src/net.rs`, −79 % sur une
# recherche Modrinth). Les téléchargements de fichiers les coupent.
#
# Deux déclarations parce que le TLS change : celui du système (native-tls)
# sur ordinateur, rustls sur Android, où OpenSSL n'existe pas. Mêmes
# fonctionnalités des deux côtés, sinon le code compilerait différemment.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "gzip", "brotli"] }
# Ordinateur seulement : mise à jour du launcher par lui-même (le téléphone
# passe par son magasin) et une seule fenêtre à la fois (Android n'ouvre de
# toute façon qu'une activité).
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "gzip", "brotli", "rustls-tls", "charset", "http2"] }
# Le dossier des fichiers de l'appli, demandé à Android (paths.rs). Les deux
# sont déjà tirés par Tauri sur Android.
jni = "0.21"
ndk-context = "0.1"

# Coffre du système pour le refresh token (src/security/vault.rs) : Windows Credential
# Manager, trousseau macOS. Pas de dépendance ailleurs : sans coffre natif, la
# crate retomberait sur un coffre en mémoire, vide à chaque démarrage.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Enregistrements SRV `_minecraft._tcp` du ping des serveurs, hors Windows
# seulement (minecraft/server_ping.rs) : sous Windows on passe par le service
# DNS du système, un client DNS à nous y déclenchait la fenêtre du pare-feu.
# Même version que celle déjà tirée par libp2p.
[target.'cfg(not(target_os = "windows"))'.dependencies]
hickory-resolver = "0.24"
