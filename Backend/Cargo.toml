[package]
name = "yuyuframe-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "yuyuframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yuyuframe-backend"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = { version = "2", features = ["deflate"] }
toml = "0.8"
rand = "0.8"
base64 = "0.22"
sha1 = "0.10"
# Licence hors ligne (api/license.rs) : vérification seule, jamais de signature
# ici — la clé privée ne quitte pas le serveur.
ed25519-dalek = "2"
sha2 = "0.10"
tungstenite = "0.24"
uuid = { version = "1", features = ["v4"] }
libp2p = { version = "0.53", features = [
    "tokio", "tcp", "dns", "noise", "yamux",
    "identify", "relay", "dcutr", "request-response", "cbor", "macros",
] }
futures = "0.3"
sysinfo = "0.31"
discord-rich-presence = "1"
fastnbt = "2"
md-5 = "0.10"
