[package]
name = "yuyuframe-backend"
# SEULE version du launcher — celle du paquet ET celle annoncée au serveur.
#
# Elle vivait en double : ici pour le code (`env!("CARGO_PKG_VERSION")`, qui
# part à l'authentification, à chaque `/v1/config` et dans les statistiques)
# et dans `tauri.conf.json` pour l'exécutable publié. Seule la seconde était
# incrémentée à chaque sortie : toute la flotte se présentait donc au serveur
# comme « 0.1.0 », ce qui rendait inopérants la version minimale, les versions
# bloquées et le ciblage « versions antérieures à » des bannières.
#
# `tauri.conf.json` n'a plus de champ `version` : Tauri reprend celle-ci.
# C'est donc ICI qu'on incrémente avant de publier.
version = "0.1.9"
edition = "2021"

[lib]
name = "yuyuframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yuyuframe-backend"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Ouvrir un lien dans le navigateur du système, téléphone compris (le `open`
# de tauri-plugin-shell, retiré, ne faisait rien sur Android) — `Frontend/src/lib/openExternal.ts`.
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = { version = "2", features = ["deflate"] }
# Liens de partage (share_link.rs) : zstd + dictionnaire figé. Déjà compilée
# pour `zip`, la déclarer n'ajoute rien au build.
zstd = { version = "0.13", default-features = false }
toml = "0.8"
rand = "0.8"
base64 = "0.22"
sha1 = "0.10"
# Licence hors ligne (security/license.rs) : vérification seule, jamais de signature
# ici — la clé privée ne quitte pas le serveur.
ed25519-dalek = "2"
# Signatures minisign des mods du registre d'Horizon (horizon/content.rs) :
# vérification seule, sans dépendance.
minisign-verify = "0.2"
# Mods natifs d'Horizon (horizon/native/) : le compilateur Rust arrive en
# .tar.gz, le SDK du jeu en .tar.xz. Déjà compilées pour d'autres dépendances.
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
sha2 = "0.10"
tungstenite = "0.24"
uuid = { version = "1", features = ["v4"] }
libp2p = { version = "0.53", features = [
    "tokio", "tcp", "dns", "noise", "yamux",
    "identify", "relay", "dcutr", "request-response", "cbor", "macros",
] }
futures = "0.3"
# Le système et les processus seulement (`System`, `Pid`) : sa partie réseau, inutile ici, ne
# compile pas pour iOS (`RTM_IFINFO2`, absent de libc pour iOS).
sysinfo = { version = "0.31", default-features = false, features = ["system", "multithread"] }
discord-rich-presence = "1"
fastnbt = "2"
md-5 = "0.10"

# `multipart` : envoi d'un PNG de skin à Mojang (voir commands/account/skin.rs
# — un fichier local devient ainsi un skin hébergé par eux, donc partageable).
# gzip/brotli : réponses des API compressées (`src/net.rs`, −79 % sur une
# recherche Modrinth). Les téléchargements de fichiers les coupent.
#
# Deux déclarations parce que le TLS change : celui du système (native-tls)
# sur ordinateur, rustls sur Android, où OpenSSL n'existe pas. Mêmes
# fonctionnalités des deux côtés, sinon le code compilerait différemment.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "gzip", "brotli"] }
# Ordinateur seulement : mise à jour du launcher par lui-même (le téléphone
# passe par son magasin) et une seule fenêtre à la fois (Android n'ouvre de
# toute façon qu'une activité).
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
# Ce que le moteur Horizon (horizon-android/, dépôt public YuyuFrame-Mobile) lit pour une partie :
# ligne de lancement, réglages, skin, garde-robe, fichiers (minecraft/launcher/horizon/android.rs).
# En local, la racine du monorepo (.cargo/config.toml) la prend dans horizon-android/.
horizon-engine-api = { git = "https://github.com/GastlySneeze38/YuyuFrame-Mobile", branch = "main" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "gzip", "brotli", "rustls-tls", "charset", "http2"] }

# iOS : le moteur Horizon est lié dans l'appli elle-même, iOS ne laissant lancer aucun autre
# processus (minecraft/launcher/horizon/ios.rs, docs/launcher/ios.md). Même dépôt que l'API du
# moteur ; en local, la racine du monorepo (.cargo/config.toml) prend les trois dans horizon-android/.
[target.'cfg(target_os = "ios")'.dependencies]
horizon-engine-api = { git = "https://github.com/GastlySneeze38/YuyuFrame-Mobile", branch = "main" }
horizon-game = { git = "https://github.com/GastlySneeze38/YuyuFrame-Mobile", branch = "main", default-features = false, features = ["audio", "horizon-extras"] }
horizon-client = { git = "https://github.com/GastlySneeze38/YuyuFrame-Mobile", branch = "main", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "gzip", "brotli", "rustls-tls", "charset", "http2"] }

# Téléphone : lire le QR code qu'un appareil déjà connecté affiche pour en
# connecter un autre (écran d'accueil, `components/onboarding/`). Demande la
# caméra au premier scan seulement.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Coffre du système pour le refresh token (src/security/vault.rs) : Windows Credential
# Manager, trousseau macOS. Pas de dépendance ailleurs : sans coffre natif, la
# crate retomberait sur un coffre en mémoire, vide à chaque démarrage.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Enregistrements SRV `_minecraft._tcp` du ping des serveurs, hors Windows
# seulement (minecraft/server_ping.rs) : sous Windows on passe par le service
# DNS du système, un client DNS à nous y déclenchait la fenêtre du pare-feu.
# Même version que celle déjà tirée par libp2p.
[target.'cfg(not(target_os = "windows"))'.dependencies]
hickory-resolver = "0.24"

# Les crates que le moteur Horizon modifie (horizon-android/Cargo.toml, `[patch.crates-io]`, et
# third_party/), reprises ici parce qu'un `[patch]` ne vaut que pour l'espace de travail qui le
# déclare : sans elles, le build iOS, qui lie le moteur, prendrait les versions d'origine. winit
# surtout : la sienne a le mode qui fait tourner le jeu dans notre appli (`spawn_app`). Aucune ne
# sert au launcher sur ordinateur ni sur Android. En local, la racine du monorepo
# (.cargo/config.toml) les prend dans horizon-android/third_party/.
[patch.crates-io]
winit = { git = "https://github.com/GastlySneeze38/YuyuFrame-Mobile", branch = "main" }
wgpu-hal = { git = "https://github.com/GastlySneeze38/YuyuFrame-Mobile", branch = "main" }
naga = { git = "https://github.com/GastlySneeze38/YuyuFrame-Mobile", branch = "main" }
libmimalloc-sys = { git = "https://github.com/GastlySneeze38/YuyuFrame-Mobile", branch = "main" }
