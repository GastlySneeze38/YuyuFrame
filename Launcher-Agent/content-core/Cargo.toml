[package]
name = "content-core"
version = "0.1.0"
edition = "2021"

# Lib chargeable par Java via JNI — séparée de rust_core.dll (p2p), aucune
# dépendance partagée avec P2P-Server/rust-core (voir docs/LauncherAgent/index.md).
[lib]
name = "content_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
ureq = { version = "2", features = ["json"] }
# Décodage d'images côté Rust (voir fetch_image_rgba dans image/fetch.rs) — codecs
# explicites plutôt que les défauts du crate (évite d'entraîner des formats
# rares/lourds à builder comme avif/exr/hdr, aucun besoin ici). webp inclus car
# ImageIO (Java) ne le décode PAS nativement — c'était le vrai motif de cet ajout.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
taffy = { version = "0.14.0", features = ["serde"] }

# Souris brute (src/mouse/windows.rs) : liaisons vers l'API Windows, sans code
# autour. Déjà dans l'arbre de dépendances par ureq — même version.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input",
    # SendInput : seulement pour le test de bout en bout (mouvement injecté).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
